<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background circle/shield -->
  <circle cx="32" cy="32" r="28" fill="#1C1814" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#FFB300" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Folded Map Geometry -->
  <path d="M18 22 L26 19 L38 23 L46 20 L46 41 L38 44 L26 40 L18 43 Z" fill="#2A241E" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Map Fold Lines -->
  <line x1="26" y1="19" x2="26" y2="40" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="38" y1="23" x2="38" y2="44" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Compass Star in Center -->
  <polygon points="32,25 34,31 40,32 34,33 32,39 30,33 24,32 30,31" fill="url(#goldGrad)"/>
  <circle cx="32" cy="32" r="1.5" fill="#1C1814"/>
</svg>
